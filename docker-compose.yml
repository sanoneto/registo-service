version: '3.8'

services:
  # Simulação do AWS S3 local com LocalStack
  s3-localstack:
    image: localstack/localstack:3.4
    container_name: s3-localstack
    restart: always
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
      - EXTRA_CORS_ALLOWED_ORIGINS=*
    volumes:
      - localstack_data:/var/lib/localstack
      - ./init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh
    networks:
      - app-network
  # Elasticsearch (Motor de Busca e Indexação)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    restart: always
    environment:
      - node.name=elasticsearch
      - cluster.name=es-docker-cluster
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Limite de RAM ajustável
      - xpack.security.enabled=false     # Segurança desativada para desenvolvimento local
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - app-network

  # Elastic Kibana (Painel Visual)
  horas_kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: horas_kibana
    restart: always
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - app-network

  # Elastic Filebeat (Coletor de Logs)
  horas_filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: horas_filebeat
    restart: always
    user: root
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - KIBANA_HOST=http://horas_kibana:5601
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - elasticsearch
      - horas_kibana
    networks:
      - app-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network

  # Redis
  aneto-redis:
    image: redis:7-alpine
    container_name: aneto-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network

  # PostgreSQL
  horas_postgres:
    image: postgres:15-alpine
    container_name: horas_postgres
    restart: always
    environment:
      POSTGRES_USER: horas_user
      POSTGRES_PASSWORD: horas_pass
      POSTGRES_DB: horas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # MySQL
  mysql-db-1:
    image: mysql:8.0
    container_name: mysql-db-1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: app_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  localstack_data:
  es_data:
  postgres_data:
  mysql_data: